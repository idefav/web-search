<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">HermesAgent 与 Camofox Web Search 集成架构</title>
  <desc id="desc">HermesAgent 通过 Python entry point 注册 Camofox Provider，再访问自托管搜索网关</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#6d28d9"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1b4b" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="980" rx="36" fill="#faf9ff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="82" font-size="46" font-weight="820" fill="#2e1065">HermesAgent 保持标准工具，Provider 负责接入网关</text>
    <text x="64" y="132" font-size="26" fill="#6b7280">插件通过 Python entry point 发现，不替换 HermesAgent 本体</text>
    <g filter="url(#shadow)">
      <rect x="70" y="228" width="250" height="246" rx="28" fill="#ffffff" stroke="#8b5cf6" stroke-width="4"/>
      <circle cx="195" cy="292" r="34" fill="#ede9fe"/>
      <path d="M179 303l16-30 16 30M184 294h22" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="195" y="360" text-anchor="middle" font-size="30" font-weight="780" fill="#4c1d95">HermesAgent</text>
      <text x="195" y="404" text-anchor="middle" font-size="22" fill="#4b5563">模型 + Web Toolset</text>
      <text x="195" y="438" text-anchor="middle" font-size="19" fill="#6b7280">对话、规划、工具选择</text>
      <rect x="454" y="204" width="292" height="294" rx="28" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
      <text x="600" y="260" text-anchor="middle" font-size="22" font-weight="800" fill="#92400e">Camofox Python Provider</text>
      <rect x="494" y="292" width="212" height="62" rx="18" fill="#fef3c7"/>
      <text x="600" y="332" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="23" fill="#92400e">web_search</text>
      <rect x="494" y="374" width="212" height="62" rx="18" fill="#fef3c7"/>
      <text x="600" y="414" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="23" fill="#92400e">web_extract</text>
      <text x="600" y="468" text-anchor="middle" font-size="18" fill="#6b7280">~/.hermes/.env 读取 Key</text>
      <rect x="880" y="228" width="250" height="246" rx="28" fill="#ffffff" stroke="#6d28d9" stroke-width="4"/>
      <circle cx="1005" cy="292" r="34" fill="#ede9fe"/>
      <path d="M984 304h42M990 304v-25h30v25" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linejoin="round"/>
      <text x="1005" y="360" text-anchor="middle" font-size="30" font-weight="780" fill="#4c1d95">Web Search</text>
      <text x="1005" y="398" text-anchor="middle" font-size="30" font-weight="780" fill="#4c1d95">Gateway</text>
      <text x="1005" y="438" text-anchor="middle" font-size="19" fill="#6b7280">认证、限流、错误语义</text>
    </g>
    <path d="M322 350H438" stroke="#6d28d9" stroke-width="7" marker-end="url(#arrow)"/>
    <path d="M748 350H864" stroke="#6d28d9" stroke-width="7" marker-end="url(#arrow)"/>
    <rect x="70" y="582" width="1060" height="290" rx="30" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
    <text x="110" y="642" font-size="28" font-weight="780" fill="#4c1d95">服务端安全边界</text>
    <g>
      <rect x="112" y="694" width="270" height="112" rx="22" fill="#ffffff"/>
      <text x="247" y="740" text-anchor="middle" font-size="24" font-weight="720" fill="#4c1d95">多 Provider 搜索</text>
      <text x="247" y="776" text-anchor="middle" font-size="18" fill="#6b7280">自动回退与冷却</text>
      <rect x="465" y="694" width="270" height="112" rx="22" fill="#ffffff"/>
      <text x="600" y="740" text-anchor="middle" font-size="24" font-weight="720" fill="#4c1d95">Camofox Browser</text>
      <text x="600" y="776" text-anchor="middle" font-size="18" fill="#6b7280">渲染与可读正文提取</text>
      <rect x="818" y="694" width="270" height="112" rx="22" fill="#ffffff"/>
      <text x="953" y="740" text-anchor="middle" font-size="24" font-weight="720" fill="#4c1d95">隔离出口</text>
      <text x="953" y="776" text-anchor="middle" font-size="18" fill="#6b7280">SSRF 与私网访问防护</text>
      <path d="M386 750h62M739 750h62" stroke="#6d28d9" stroke-width="6" marker-end="url(#arrow)"/>
    </g>
    <text x="600" y="925" text-anchor="middle" font-size="22" font-weight="650" fill="#5b21b6">Agent 获得公开网页正文，但不会获得浏览器控制权</text>
  </g>
</svg>
