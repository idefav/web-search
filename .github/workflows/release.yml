name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit
      - name: Verify release tag and package versions
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: npm run release:verify
      - name: Verify npm package contents
        run: |
          npm pack --dry-run --workspace camofox-web-search-core
          npm pack --dry-run --workspace camofox-web-search-client
          npm pack --dry-run --workspace camofox-web-search
          npm pack --dry-run --workspace camofox-web-search-pi

  container:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-qemu-action@v4.0.0
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  npm:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run build
      - name: Publish packages through npm Trusted Publishing
        run: |
          publish_workspace() {
            workspace="$1"
            name=$(node -p "require('./$workspace/package.json').name")
            version=$(node -p "require('./$workspace/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already exists; skipping"
            else
              npm publish --workspace "$name" --access public --tag "$NPM_DIST_TAG"
            fi
          }
          publish_workspace packages/core
          publish_workspace packages/client
          publish_workspace packages/cli
          publish_workspace plugins/pi
