name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version already present in package.json files
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: node scripts/verify-release.mjs
      - name: Publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace camofox-web-search-core --access public --provenance
          npm publish --workspace camofox-web-search-client --access public --provenance
          npm publish --workspace camofox-web-search --access public --provenance
          npm publish --workspace camofox-web-search-pi --access public --provenance
