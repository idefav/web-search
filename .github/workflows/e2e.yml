name: Docker E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_SEARCH_API_KEY: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      CAMOFOX_ACCESS_KEY: iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii
      WEB_SEARCH_ENDPOINT: http://127.0.0.1:8080
      COMPOSE_PROJECT_NAME: camofox-web-search-e2e
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
      - run: npm ci && npm run build
      - name: Start full stack
        run: docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 180
      - name: Run E2E
        run: scripts/docker-e2e.sh
      - name: Run OpenClaw native provider E2E
        env:
          OPENCLAW_STATE_DIR: /tmp/openclaw-e2e
        run: |
          npm pack --workspace camofox-web-search-openclaw --pack-destination /tmp
          npm install --global openclaw@2026.7.1-2
          openclaw plugins install /tmp/camofox-web-search-openclaw-*.tgz --force
          node scripts/openclaw-provider-smoke.mjs
      - name: Run HermesAgent native provider E2E
        run: |
          uv venv /tmp/hermes-e2e
          git init /tmp/hermes-agent
          git -C /tmp/hermes-agent remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C /tmp/hermes-agent fetch --depth=1 origin 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
          git -C /tmp/hermes-agent checkout --detach FETCH_HEAD
          uv pip install --python /tmp/hermes-e2e/bin/python -e /tmp/hermes-agent plugins/hermes
          /tmp/hermes-e2e/bin/python scripts/hermes-provider-smoke.py
      - name: Container logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --tail=300
      - name: Stop full stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v --remove-orphans
